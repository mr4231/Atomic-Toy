[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-toy-model"
version = "0.1.0"
description = "A reproducible 3D atomic interaction toy model for scientific computing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10.0", "flask>=3.0"]

[tool.setuptools]
packages = ["src", "src.physics", "src.integration", "src.dissipation", "src.simulation", "src.utils", "visualisation", "c_backend"]
